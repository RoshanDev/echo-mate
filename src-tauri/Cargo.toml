[package]
name = "echo-mate"
version = "0.1.0"
description = "EchoMate - AI Reply Copilot for WeChat"
authors = ["Roshan"]
license = "MIT"
repository = "https://github.com/RoshanDev/echo-mate"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri & plugins
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["fs", "io-util", "process", "time", "macros", "rt-multi-thread"] }

# Database (encrypted SQLite)
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

# OS keyring for DB key storage
keyring = "3"

# Input simulation (Ctrl/Cmd+C)
enigo = "0.3"

# Screenshot encoding
image = { version = "0.25", default-features = false, features = ["png"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"
