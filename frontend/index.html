<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoMate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="header">EchoMate - AI 回复助手</div>
    <div id="candidates">
      <div class="candidate-card" v-for="i in 5" data-index="i-1">
        <div class="candidate-text">等待生成...</div>
        <div class="candidate-meta">
          <span class="tone"></span>
          <button class="copy-btn">复制</button>
        </div>
      </div>
    </div>
    <div id="status">按热键开始...</div>
  </div>
  <script src="main.js"></script>
</body>
</html>
