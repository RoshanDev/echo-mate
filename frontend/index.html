<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoMate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Candidate Popup -->
  <div id="popup">
    <div id="header">
      <div class="header-left">
        <div class="logo-icon">E</div>
        <span class="logo-text">EchoMate</span>
      </div>
      <div class="header-right">
        <button id="btn-settings" class="icon-btn" title="设置">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="2.5"/>
            <path d="M8 1.5v2M8 12.5v2M2.5 8h2M11.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>
          </svg>
        </button>
        <button id="btn-close" class="icon-btn" title="关闭">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4l8 8M12 4l-8 8"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="status-bar">
      <span id="status-dot"></span>
      <span id="status-text">就绪，自动识别剪贴板文字或截图</span>
      <select id="contact-select" title="当前上下文联系人">
        <option value="">未选择联系人</option>
      </select>
      <span id="provider-badge"></span>
      <input id="topic-hint-input" type="text" maxlength="80" placeholder="找话题参考（可空）" />
      <button id="btn-topic-generate">💬 找话题</button>
      <button id="btn-screenshot-generate">▣ 框选截图</button>
      <button id="btn-test-generate">⚡ 生成回复</button>
    </div>

    <div id="screenshot-batch-bar">
      <span id="screenshot-batch-status">多截图：0 张</span>
      <button id="btn-screenshot-batch-add">＋ 添加截图</button>
      <button id="btn-screenshot-batch-generate">按顺序生成</button>
      <button id="btn-screenshot-batch-clear">清空</button>
    </div>

    <div id="mode-indicator" style="display:none">
      <span id="mode-label"></span>
      <span id="provider-label"></span>
    </div>

    <div id="inbound-banner" style="display:none"></div>

    <div id="insights-container" style="display:none">
      <section class="insight-section" id="action-section">
        <div class="section-title">当前适合做什么</div>
        <div id="action-card" class="insight-card"></div>
      </section>

      <section class="insight-section" id="context-section">
        <div class="section-title">上下文来源</div>
        <div id="context-card" class="insight-card"></div>
      </section>

      <section class="insight-section" id="screenshot-analysis-section">
        <div class="section-title">截图理解</div>
        <div id="screenshot-analysis-card" class="insight-card"></div>
      </section>

      <section class="insight-section" id="memory-section">
        <div class="section-title">可能值得记住</div>
        <div id="memory-cards" class="mini-card-list"></div>
      </section>

      <section class="insight-section" id="reminder-section">
        <div class="section-title">提醒建议</div>
        <div id="reminder-cards" class="mini-card-list"></div>
      </section>
    </div>

    <div id="reminder-panel" style="display:none"></div>

    <div id="candidates-container">
      <div id="loading" style="display:none">
        <div class="spinner"></div>
        <span>正在生成候选回复...</span>
      </div>
      <div id="error-msg" style="display:none"></div>
      <div id="candidates-list"></div>
    </div>

    <div id="actions" style="display:none">
      <button id="btn-conservative" class="action-btn secondary">🛡 再保守一点</button>
      <button id="btn-fun" class="action-btn secondary">😄 再轻松一点</button>
      <button id="btn-regenerate" class="action-btn primary">🔄 重新生成</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
