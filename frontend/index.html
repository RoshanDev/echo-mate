<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoMate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Candidate Popup -->
  <div id="popup">
    <div id="header">
      <div class="header-left">
        <span class="logo">EchoMate</span>
      </div>
      <div class="header-right">
        <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
        <button id="btn-close" class="icon-btn" title="关闭">✕</button>
      </div>
    </div>

    <div id="status-bar">
      <span id="status-icon">📋</span>
      <span id="status-text">就绪，等待热键触发...</span>
      <span id="provider-badge"></span>
    </div>

    <div id="mode-indicator" style="display:none">
      <span id="mode-label"></span>
      <span id="provider-label"></span>
    </div>

    <div id="candidates-container">
      <div id="loading" style="display:none">
        <div class="spinner"></div>
        <span>正在生成候选回复...</span>
      </div>
      <div id="error-msg" style="display:none"></div>
      <div id="candidates-list"></div>
    </div>

    <div id="actions" style="display:none">
      <button id="btn-conservative" class="action-btn secondary">🛡 再保守一点</button>
      <button id="btn-fun" class="action-btn secondary">😄 再有趣一点</button>
      <button id="btn-regenerate" class="action-btn primary">🔄 重新生成</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
