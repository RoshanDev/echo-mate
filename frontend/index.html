<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoMate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Candidate Popup -->
  <div id="popup">
    <div id="header">
      <div class="header-left">
        <div class="logo-icon">E</div>
        <span class="logo-text">EchoMate</span>
      </div>
      <div class="header-right">
        <button id="btn-settings" class="icon-btn" title="设置">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="2.5"/>
            <path d="M8 1.5v2M8 12.5v2M2.5 8h2M11.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>
          </svg>
        </button>
        <button id="btn-close" class="icon-btn" title="关闭">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4l8 8M12 4l-8 8"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="status-bar">
      <span id="status-dot"></span>
      <span id="status-text">就绪，点击"生成回复"或按热键触发</span>
      <span id="provider-badge"></span>
      <button id="btn-screenshot-generate">▣ 截图上下文</button>
      <button id="btn-test-generate">⚡ 生成回复</button>
    </div>

    <div id="mode-indicator" style="display:none">
      <span id="mode-label"></span>
      <span id="provider-label"></span>
    </div>

    <div id="candidates-container">
      <div id="loading" style="display:none">
        <div class="spinner"></div>
        <span>正在生成候选回复...</span>
      </div>
      <div id="error-msg" style="display:none"></div>
      <div id="candidates-list"></div>
    </div>

    <div id="actions" style="display:none">
      <button id="btn-conservative" class="action-btn secondary">🛡 再保守一点</button>
      <button id="btn-fun" class="action-btn secondary">😄 再有趣一点</button>
      <button id="btn-regenerate" class="action-btn primary">🔄 重新生成</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
