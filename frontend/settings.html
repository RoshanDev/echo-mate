<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoMate Settings</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="settings-body">
  <div id="settings-page">
    <div class="settings-header">
      <button id="btn-back" class="back-btn" title="返回">←</button>
      <h2>设置</h2>
    </div>

    <div class="settings-section">
      <h3>快捷键</h3>
      <div class="setting-row">
        <label>全局热键</label>
        <input type="text" id="setting-hotkey" value="CmdOrCtrl+Shift+Space" readonly />
        <button id="btn-record-hotkey" class="small-btn">录制</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>Provider</h3>
      <div class="setting-row">
        <label>主 Provider</label>
        <select id="setting-primary-provider">
          <option value="claude">Claude</option>
          <option value="codex">Codex</option>
        </select>
      </div>
      <div class="setting-row">
        <label>备用 Provider</label>
        <select id="setting-fallback-provider">
          <option value="claude">Claude</option>
          <option value="codex">Codex</option>
          <option value="none">无</option>
        </select>
      </div>
      <div class="setting-row">
        <label>候选数量</label>
        <input type="number" id="setting-candidate-count" value="5" min="3" max="10" />
      </div>
      <div class="setting-row">
        <label>超时 (秒)</label>
        <input type="number" id="setting-timeout" value="45" min="15" max="120" />
      </div>
    </div>

    <div class="settings-section">
      <h3>隐私与安全</h3>
      <div class="setting-row">
        <label>严格隐私模式</label>
        <input type="checkbox" id="setting-strict-privacy" checked />
        <span class="hint">不记录原始消息全文</span>
      </div>
      <div class="setting-row">
        <label>全局隐私模式</label>
        <input type="checkbox" id="setting-global-privacy" />
        <span class="hint">只生成候选，不保存上下文、记忆或提醒</span>
      </div>
      <div class="setting-row">
        <label>上下文保留</label>
        <input type="number" id="setting-retention-days" value="30" min="1" max="365" />
        <span class="hint">天</span>
      </div>
      <div class="setting-row">
        <label>数据库加密</label>
        <input type="checkbox" id="setting-sqlcipher" />
        <span class="hint">使用 SQLCipher 加密数据库</span>
      </div>
    </div>

    <div class="settings-section">
      <h3>联系人白名单</h3>
      <div class="contact-editor">
        <input type="hidden" id="contact-id" />
        <input type="text" id="contact-alias" placeholder="联系人别名，例如 齐齐" />
        <select id="contact-channel">
          <option value="wechat">微信</option>
          <option value="manual">手动</option>
        </select>
        <label class="inline-check">
          <input type="checkbox" id="contact-allowlisted" checked />
          启用
        </label>
        <button id="btn-save-contact" class="small-btn">保存联系人</button>
      </div>
      <div id="contacts-list" class="settings-list"></div>
    </div>

    <div class="settings-section">
      <h3>权限与平台近似能力</h3>
      <div class="setting-row">
        <label>Windows 通知 helper</label>
        <input type="checkbox" id="setting-windows-helper" />
        <span class="hint">可选；需系统授权，失败会降级</span>
      </div>
      <div class="setting-row">
        <label>macOS 上下文 helper</label>
        <input type="checkbox" id="setting-macos-helper" />
        <span class="hint">只做前台/Pasteboard/Accessibility 近似</span>
      </div>
      <div class="setting-row">
        <label>Accessibility</label>
        <input type="checkbox" id="setting-macos-accessibility" />
        <span class="hint">用户主动开启，随时可关闭</span>
      </div>
      <div id="permission-status" class="permission-box"></div>
    </div>

    <div class="settings-section">
      <h3>风格画像</h3>
      <div class="setting-row">
        <label>语气</label>
        <select id="setting-tone">
          <option value="warm_calm">温和冷静</option>
          <option value="casual">轻松随意</option>
          <option value="formal">正式礼貌</option>
          <option value="humorous">幽默风趣</option>
        </select>
      </div>
      <div class="setting-row">
        <label>回复长度</label>
        <select id="setting-length">
          <option value="short">短 (8-20字)</option>
          <option value="short_to_medium" selected>短到中等 (10-45字)</option>
          <option value="medium">中等 (20-60字)</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Emoji 程度</label>
        <input type="range" id="setting-emoji" value="0.2" min="0" max="1" step="0.1" />
      </div>
      <div class="setting-row">
        <label>幽默程度</label>
        <input type="range" id="setting-humor" value="0.3" min="0" max="1" step="0.1" />
      </div>
      <div class="style-profile-box">
        <div id="style-profile-summary" class="style-profile-summary">暂无本地画像</div>
        <div class="style-profile-meta">
          <span>样本 <strong id="style-profile-samples">0</strong></span>
          <span>平均 <strong id="style-profile-avg">-</strong></span>
          <span>更新 <strong id="style-profile-updated">未生成</strong></span>
        </div>
        <div id="style-profile-tags" class="style-profile-tags"></div>
        <div id="style-profile-status" class="style-profile-status"></div>
        <div class="style-profile-actions">
          <button id="btn-refresh-style-profile" class="small-btn">刷新画像</button>
          <button id="btn-reset-style-profile" class="small-btn danger">重置画像</button>
        </div>
      </div>
    </div>

    <div class="settings-actions">
      <button id="btn-save-settings" class="action-btn primary">保存设置</button>
      <button id="btn-reset-settings" class="action-btn secondary">恢复默认</button>
    </div>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
