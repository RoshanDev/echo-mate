name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  js-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax checks
        run: |
          node --check frontend/main.js
          node --check frontend/settings.js
          node --check tests/windows-e2e-runner.mjs
          node --check tests/macos-smoke-runner.mjs

  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: rust-${{ matrix.os }}

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  build-tauri:
    name: Tauri Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [js-syntax, rust-test]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: rust-${{ matrix.os }}

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm exec tauri build

      - name: macOS signing and notarization gate
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Signing/notarization secrets are present; wire Tauri signing identity before release."
          else
            echo "Signing/notarization secrets are missing; unsigned CI bundle only."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: echomate-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle
